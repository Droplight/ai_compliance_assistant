<!DOCTYPE html>
<html>
<head>
    <title>Compliance Assistant</title>
    <style>
        body {
            font-family: Arial;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }
        textarea {
            width: 100%;
            height: 120px;
            margin-bottom: 10px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
        }
        pre {
            background: #eee;
            padding: 10px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<h2>AI Compliance Assistant</h2>

<textarea id="queryBox" placeholder="Enter your compliance question here..."></textarea>
<br>
<button onclick="analyze()">Analyze</button>

<h3>Response:</h3>
<pre id="output"></pre>

<script>
async function analyze() {
    const userQuery = document.getElementById("queryBox").value;

    const response = await fetch("https://ai-compliance-assistant-ehxb.onrender.com/analyze", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ query: userQuery })
    });

    const data = await response.json();
    document.getElementById("output").textContent = JSON.stringify(data, null, 2);
}
</script>

</body>
</html>
